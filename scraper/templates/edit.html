<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Spa · PrivateSpa</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <a href="/" class="back-link">← Back to all spas</a>
        <h1 id="editor-title">Edit spa</h1>
        <nav id="spa-nav" class="spa-nav hidden" aria-label="Spa navigation">
          <button
            type="button"
            id="spa-prev-btn"
            class="spa-nav-btn"
            aria-label="Previous spa"
          >
            ‹
          </button>
          <span id="spa-nav-label" class="spa-nav-label"></span>
          <button
            type="button"
            id="spa-next-btn"
            class="spa-nav-btn"
            aria-label="Next spa"
          >
            ›
          </button>
        </nav>
      </header>

      <div id="review-bar" class="review-bar hidden">
        <div class="review-bar-text">
          <strong>Draft</strong>
          <span id="review-progress"></span>
          <span class="review-bar-hint">Edit anything below, then decide.</span>
        </div>
        <div class="review-bar-actions">
          <button type="button" id="reject-btn" class="reject-btn">✕ Reject</button>
          <button type="button" id="accept-btn" class="accept-btn">✓ Accept &amp; publish</button>
        </div>
      </div>

      <div id="status" class="status hidden"></div>

      <section id="editor" class="editor">
        <div class="editor-header">
          <div class="meta">
            <span id="meta-mode"></span>
            <span id="meta-playwright"></span>
            <span id="meta-source"></span>
            <span id="meta-status"></span>
          </div>
          <div class="editor-actions">
            <button type="button" id="publish-btn" class="secondary-btn hidden">
              Publish
            </button>
            <button
              type="button"
              id="rescrape-missing-btn"
              class="secondary-btn hidden"
            >
              Rescrape missing
            </button>
            <button type="button" id="save-spa-btn" class="save-btn">
              Save to Firebase
            </button>
          </div>
        </div>

        <div class="field">
          <label>Images <span class="hint">(drag ⋮⋮ into gaps)</span></label>
          <div id="image-list" class="image-list"></div>
          <div class="add-image-row">
            <input
              type="text"
              id="new-image-url"
              placeholder="https://example.com/image.jpg"
            />
            <button type="button" id="add-image-btn">Add image</button>
          </div>
          <div class="upload-images-row">
            <button
              type="button"
              id="upload-images-btn"
              class="upload-btn"
              disabled
            >
              Convert & Upload
            </button>
            <span id="upload-status" class="upload-status hidden"></span>
            <button
              type="button"
              id="generate-thumbnail-btn"
              class="thumbnail-btn"
              disabled
            >
              Generate thumbnail
            </button>
            <span id="thumbnail-status" class="thumbnail-status hidden"></span>
          </div>
        </div>

        <div class="field" id="thumbnail-field">
          <label>Thumbnail</label>
          <div id="thumbnail-preview" class="thumbnail-preview">
            <p id="thumbnail-empty" class="thumbnail-empty">
              No thumbnail yet. Generate one from the first image above.
            </p>
            <img
              id="thumbnail-img"
              class="thumbnail-img hidden"
              alt="Spa thumbnail"
            />
            <span id="thumbnail-meta" class="thumbnail-meta hidden"></span>
          </div>
        </div>

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" />
        </div>

        <div class="field-row field-row-slug-premium">
          <div class="field">
            <label for="slug">Slug</label>
            <input type="text" id="slug" placeholder="la-spa-suite" />
          </div>
          <div class="field field-premium">
            <label for="premium">Premium</label>
            <label class="premium-control" for="premium">
              <input type="checkbox" id="premium" />
            </label>
          </div>
        </div>

        <div class="field">
          <label for="country">Country</label>
          <select id="country">
            <option value="CH">Switzerland</option>
            <option value="DE">Germany</option>
            <option value="AT">Austria</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="owner">Owner</label>
            <input type="text" id="owner" />
          </div>
          <div class="field">
            <label for="contact">Contact</label>
            <input type="email" id="contact" placeholder="info@example.ch" autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="description">Description (German)</label>
          <textarea id="description" rows="4"></textarea>
        </div>

        <div class="field">
          <label for="description-en">Description (English)</label>
          <textarea id="description-en" rows="4"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" />
          </div>
          <div class="field">
            <label for="canton">Canton</label>
            <input type="text" id="canton" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="website">Website</label>
            <input type="url" id="website" />
          </div>
          <div class="field">
            <label for="price-from">Price from (CHF)</label>
            <input
              type="number"
              id="price-from"
              min="0"
              step="1"
              placeholder="150"
            />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="latitude">Latitude</label>
            <input type="text" id="latitude" placeholder="47.3769" />
          </div>
          <div class="field">
            <label for="longitude">Longitude</label>
            <input type="text" id="longitude" placeholder="8.5417" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Amenities (German) <span class="hint">(one per line)</span></label>
            <textarea id="amenities" rows="6"></textarea>
          </div>
          <div class="field">
            <label>Amenities (English) <span class="hint">(same order)</span></label>
            <textarea id="amenities-en" rows="6"></textarea>
          </div>
        </div>

        <div class="field" id="raw-preview-field">
          <label>Raw text preview <span class="hint">(read-only)</span></label>
          <textarea id="raw-preview" rows="4" readonly></textarea>
        </div>

        <div id="delete-listing-row" class="delete-listing-row hidden">
          <button type="button" id="delete-spa-btn" class="delete-listing-btn">
            Delete listing
          </button>
        </div>
      </section>
    </div>

    <div id="lightbox" class="lightbox hidden" aria-hidden="true">
      <button
        type="button"
        id="lightbox-close"
        class="lightbox-close"
        aria-label="Close"
      >
        ×
      </button>
      <div class="lightbox-stage">
        <div class="lightbox-image-wrap">
          <img id="lightbox-img" alt="Expanded preview" />
          <button
            type="button"
            id="lightbox-prev"
            class="lightbox-nav lightbox-prev"
            aria-label="Previous image"
          >
            ‹
          </button>
          <button
            type="button"
            id="lightbox-next"
            class="lightbox-nav lightbox-next"
            aria-label="Next image"
          >
            ›
          </button>
          <button
            type="button"
            id="lightbox-delete"
            class="lightbox-delete"
            aria-label="Delete image"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <div id="delete-modal" class="delete-modal hidden" aria-hidden="true">
      <div class="delete-modal-dialog" role="dialog" aria-modal="true">
        <h2>Delete listing</h2>
        <p>
          This permanently deletes the spa from Firestore and removes all
          uploaded images and thumbnails from Firebase Storage.
        </p>
        <p class="delete-modal-hint">
          Type <strong>DELETE</strong> to confirm.
        </p>
        <input
          type="text"
          id="delete-confirm-input"
          placeholder="DELETE"
          autocomplete="off"
        />
        <div class="delete-modal-actions">
          <button type="button" id="delete-cancel-btn" class="secondary-btn">
            Cancel
          </button>
          <button
            type="button"
            id="delete-confirm-btn"
            class="delete-btn"
            disabled
          >
            Delete permanently
          </button>
        </div>
      </div>
    </div>

    <script id="editor-config" type="application/json">
      {{ editor_config | tojson }}
    </script>
    <script src="/static/editor.js"></script>
  </body>
</html>
