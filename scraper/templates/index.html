<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivateSpa Scraper</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>PrivateSpa Scraper</h1>
        <p>
          Scrape a new spa from a URL, or select an existing spa from Firestore
          to edit.
        </p>
        <nav class="top-links"><a href="/regions">Regions &amp; crawler →</a></nav>
      </header>

      <section class="scrape-section">
        <h2>Scrape new spa</h2>
        <form id="scrape-form" class="url-form">
          <input
            type="text"
            id="url-input"
            placeholder="laspasuite.ch"
            required
            autocomplete="url"
          />
          <button type="submit" id="scrape-btn">Scrape</button>
        </form>
        <div id="status" class="status hidden"></div>
      </section>

      <section class="spa-library">
        <div class="spa-library-header">
          <h2>Existing spas</h2>
          <div class="spa-library-actions">
            <button type="button" id="create-spa-btn" class="save-btn">
              New spa
            </button>
            <button type="button" id="refresh-spas-btn" class="secondary-btn">
              Refresh
            </button>
          </div>
        </div>
        <input
          type="search"
          id="spa-search"
          class="spa-search"
          placeholder="Search by name, canton, location, contact…"
          autocomplete="off"
        />
        <div class="spa-filter" role="group" aria-label="Filter by status">
          <button type="button" class="secondary-btn active" data-filter="all">All</button>
          <button type="button" class="secondary-btn" data-filter="draft">Drafts</button>
          <button type="button" class="secondary-btn" data-filter="published">Published</button>
        </div>
        <p id="spa-list-count" class="spa-list-count hidden"></p>
        <div id="spa-list-status" class="status hidden"></div>
        <div id="spa-list" class="spa-list"></div>
      </section>
    </div>

    <script src="/static/home.js"></script>
  </body>
</html>
